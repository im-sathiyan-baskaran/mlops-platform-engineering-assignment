{{- if .Values.secrets.external.enabled }}
{{- if not .Values.secrets.external.dataFrom }}
{{- fail "secrets.external.enabled=true needs at least one entry in secrets.external.dataFrom" }}
{{- end }}
apiVersion: {{ .Values.secrets.external.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "ml-api.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ml-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.external.secretStoreRef.kind }}
    name: {{ .Values.secrets.external.secretStoreRef.name }}
  target:
    name: {{ include "ml-api.fullname" . }}-secrets
    creationPolicy: Owner
  dataFrom:
    {{- toYaml .Values.secrets.external.dataFrom | nindent 4 }}
{{- end }}