suite: secrets
release:
  name: iris-api
  namespace: dev
tests:
  - it: no envFrom by default
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: existingSecret is injected with envFrom
    template: templates/deployment.yaml
    set:
      secrets:
        existingSecret: my-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: my-secret

  - it: ExternalSecret renders and the Deployment reads its target Secret
    template: templates/externalsecret.yaml
    set:
      secrets:
        external:
          enabled: true
          dataFrom:
            - extract:
                key: ml/iris-api/dev
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.target.name
          value: iris-api-secrets
      - equal:
          path: spec.dataFrom[0].extract.key
          value: ml/iris-api/dev

  - it: ExternalSecret fails the render with no data source
    template: templates/externalsecret.yaml
    set:
      secrets:
        external:
          enabled: true
    asserts:
      - failedTemplate: {}