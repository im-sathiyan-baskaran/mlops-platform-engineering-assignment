args: []          # command-line args for the container
env: {}           # plain env vars as a map

containerPort: 8080

resources:
  requests: { cpu: 50m, memory: 32Mi }
  limits: { memory: 64Mi }

service:
  type: ClusterIP
  port: 80
  nodePort: null
