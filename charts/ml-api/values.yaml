replicaCount: 1

image:
  repository: hashicorp/http-echo
  tag: "1.0"
  pullPolicy: IfNotPresent

probes:
  liveness:  { path: /, periodSeconds: 10 }
  readiness: { path: /, periodSeconds: 5 }

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
    
args: []          # command-line args for the container
env: {}           # plain env vars as a map

containerPort: 8080

resources:
  requests: { cpu: 50m, memory: 32Mi }
  limits: { memory: 64Mi }

service:
  type: ClusterIP
  port: 80
  nodePort: null

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null
  # Scale up fast, scale down slowly (avoids flapping on bursty traffic)
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300