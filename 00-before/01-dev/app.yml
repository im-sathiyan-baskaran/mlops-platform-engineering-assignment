# Namespace

apiVersion: v1
kind: Namespace
metadata:
  name: dev
---
# Deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-api
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-api
  template:
    metadata: 
      labels:
        app: hello-api
    spec:
      containers: 
        - name: hello-api
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=Hello World from dev"]
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
---
# Service

apiVersion: v1
kind: Service
metadata:
  name: hello-api
  namespace: dev
spec:
  type: NodePort
  selector:
    app: hello-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080  
